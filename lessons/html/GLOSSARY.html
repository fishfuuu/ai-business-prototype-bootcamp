let currentCat = 'all';

function renderTerms(list) {
  const grid = document.getElementById('termsGrid');
  grid.innerHTML = '';
  list.forEach(t => {
    const card = document.createElement('div');
    card.className = 'term-card';
    card.innerHTML = `
      <div class="term-header">
        <div class="term-title">${t.name}</div>
        <span class="term-lesson-badge">${t.lesson}</span>
      </div>
      <div class="term-section"><span class="term-label what">【是什么】</span>${t.what}</div>
      <div class="term-section"><span class="term-label how">【怎么用】</span>${t.how}</div>
      <div class="term-section"><span class="term-label redline">【避坑红线】</span>${t.redline}</div>
      <div class="term-meta">
        <span class="term-tag">🏷️ ${t.tag}</span>
        <span style="opacity: .6;">分类: ${t.category}</span>
      </div>
    `;
    grid.appendChild(card);
  });
}

function filterTerms() {
  const query = document.getElementById('searchInput').value.toLowerCase();
  const filtered = terms.filter(t => {
    const matchCat = (currentCat === 'all' || t.category === currentCat);
    const matchQ = t.name.toLowerCase().includes(query) || t.what.toLowerCase().includes(query) || t.how.toLowerCase().includes(query) || t.redline.toLowerCase().includes(query) || t.tag.toLowerCase().includes(query);
    return matchCat && matchQ;
  });
  renderTerms(filtered);
}

function setCategory(cat, btn) {
  currentCat = cat;
  document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  filterTerms();
}

document.getElementById('cntAll').innerText = terms.length;
renderTerms(terms);
