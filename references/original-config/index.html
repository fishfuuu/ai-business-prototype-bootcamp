<!doctype html>
<html>
  <head>
    <title>有志者UZIS</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="有志者UZIS 新一代篮球运动品牌 又帅又能打" />
    <link rel="shortcut icon" type="image/x-icon" href="src/assets/images/favicon.svg" />

    <style>
      /* 防止页面刷新时白屏的初始样式 + 渐变底纹提供毛玻璃模糊源 */
      html {
        background: linear-gradient(135deg, #f0f4f8 0%, #e2e8f0 50%, #f0f4f8 100%);
        min-height: 100vh;
      }

      html.dark {
        background: linear-gradient(135deg, #0a0a12 0%, #131323 50%, #0a0a12 100%);
      }

      /* 全局 loading 毛玻璃效果（提前注入，确保刷新时可用） */
      .art-loading-fix {
        backdrop-filter: blur(16px) !important;
        -webkit-backdrop-filter: blur(16px) !important;
        background: radial-gradient(ellipse at 50% 50%, rgba(255,255,255,0.05) 0%, rgba(255,255,255,0.35) 100%) !important;
      }

      html.dark .art-loading-fix {
        background: radial-gradient(ellipse at 50% 50%, rgba(200,200,200,0.03) 0%, rgba(7,7,7,0.35) 100%) !important;
      }

      /* 静态初始 loading 遮罩 */
      #initial-loading {
        position: fixed !important;
        top: 0 !important;
        left: 0 !important;
        right: 0 !important;
        bottom: 0 !important;
        width: 100vw !important;
        height: 100vh !important;
        display: flex !important;
        align-items: center !important;
        justify-content: center !important;
        z-index: 9999;
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        background: rgba(255, 255, 255, 0.85);
      }

      html.dark #initial-loading {
        background: rgba(7, 7, 7, 0.85);
      }

      #initial-loading svg {
        display: block;
        width: 96px;
        height: 96px;
        animation: initial-logo-breath 1.2s ease-in-out infinite;
        transform: translateZ(0);
        backface-visibility: hidden;
        will-change: transform, opacity;
        filter: drop-shadow(0 8px 24px rgba(255, 66, 34, 0.25));
      }

      @keyframes initial-logo-breath {
        0%, 100% { transform: scale(0.99) translateZ(0); opacity: 0.92; }
        50% { transform: scale(1.02) translateZ(0); opacity: 1; }
      }
      @keyframes initial-stroke-top {
        0% { stroke-dashoffset: 52; opacity: 0.25; }
        45% { stroke-dashoffset: 0; opacity: 1; }
        55% { stroke-dashoffset: 0; opacity: 1; }
        100% { stroke-dashoffset: -52; opacity: 0.25; }
      }
      @keyframes initial-stroke-bottom {
        0% { stroke-dashoffset: 78; opacity: 0.25; }
        45% { stroke-dashoffset: 0; opacity: 1; }
        55% { stroke-dashoffset: 0; opacity: 1; }
        100% { stroke-dashoffset: -78; opacity: 0.25; }
      }

      #initial-loading.hidden {
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.3s ease;
      }
    </style>

    <script>
      // 初始化 html class 主题属性
      ;(function () {
        try {
          if (typeof Storage === 'undefined' || !window.localStorage) {
            return
          }

      const themeType = localStorage.getItem('sys-theme')
      if (themeType === 'dark') {
        document.documentElement.classList.add('dark')
      } else if (themeType === 'system' || !themeType) {
        if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
          document.documentElement.classList.add('dark')
        }
      }
        } catch (e) {
          console.warn('Failed to apply initial theme:', e)
        }
      })()
    </script>
  </head>

  <body>
    <div id="app"></div>
    <div id="initial-loading">
      <svg viewBox="0 0 100 100">
        <rect x="0" y="0" width="100" height="100" fill="#FF4222" rx="8"/>
        <path d="M22 52 L58 28" stroke="white" stroke-width="14" stroke-linecap="butt" stroke-dasharray="52" style="animation: initial-stroke-top 1.0s ease-in-out infinite; will-change: stroke-dashoffset, opacity"/>
        <path d="M18 76 L76 36" stroke="white" stroke-width="14" stroke-linecap="butt" stroke-dasharray="78" style="animation: initial-stroke-bottom 1.0s ease-in-out 0.3s infinite; will-change: stroke-dashoffset, opacity"/>
      </svg>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
